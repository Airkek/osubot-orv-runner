name: osu-replay-viewer

services:
  osu-replay-viewer-server:
    container_name: osu-replay-viewer-server
    build: .
    init: true
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OSU_LAZER_STORAGE_PATH=${OSU_LAZER_STORAGE_PATH:-/root/.local/share/osu_replay_viewer}
    volumes:
      - ${RENDERS_DIR:-./renders}:/app/renders:rw
      - ${FAILED_REPLAYS_DIR:-./failed_replays}:/app/failed_replays:rw
      - ${ORV_DATA_DIR:-./orv-data}:/root/.local/share/osu_replay_viewer:rw
    devices:
      - /dev/dri:/dev/dri
    networks:
      - orv-network
    restart: unless-stopped

networks:
  orv-network:
    driver: bridge
